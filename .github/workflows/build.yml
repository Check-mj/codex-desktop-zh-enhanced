name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build launcher
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File source/codex-desktop-zh-main/build.ps1

      - name: Verify build output
        shell: powershell
        run: |
          $exe = 'source/codex-desktop-zh-main/dist/Codex-Zh-Launcher-Windows-x64.exe'
          if (-not (Test-Path $exe)) { throw "构建失败：未生成 $exe" }
          Get-Item $exe | Select-Object Name, Length, LastWriteTime | Format-List

      - name: Package installers
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File 打包安装版.ps1 -NoPause

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: codex-zh-launcher-installer
          path: 发布/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: codex-zh-launcher-installer
          path: 发布

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: 发布/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
